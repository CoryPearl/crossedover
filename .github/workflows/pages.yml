name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
      - 'scripts/check-release.py'
      - 'VERSION'
  workflow_dispatch:
  release:
    types: [published]
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Check release docs and website
        run: python3 scripts/check-release.py
      - name: Build static website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s website -p 'test_*.py'
          if python3 website/download_stats.py --output "$RUNNER_TEMP/downloads.json"; then
            python3 website/build.py --download-stats "$RUNNER_TEMP/downloads.json"
          else
            python3 website/build.py
          fi
      - name: Upload website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
